<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Costela no bafo assada na lenha. Delivery aos sábados, domingos e feriados. Reserve de segunda a sexta e ganhe a entrega.">
  <meta name="theme-color" content="#0d0b0a">
  <title>Brunão Costela no Bafo — Cardápio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Selo da marca, desenhado em SVG para ficar nítido em qualquer tamanho. -->
  <svg class="svg-oculto" aria-hidden="true" focusable="false">
    <symbol id="selo-brunao" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="99" fill="#0d0b0a"/>
      <circle cx="100" cy="100" r="95" fill="none" stroke="#e2d3bb" stroke-width="6"/>
      <circle cx="100" cy="100" r="83" fill="none" stroke="#e2d3bb" stroke-width="3.5"
              stroke-dasharray="0.1 9.4" stroke-linecap="round"/>
      <path id="arco-topo" d="M100,100 m-64,0 a64,64 0 0 1 128,0" fill="none"/>
      <path id="arco-base" d="M100,100 m62,0 a62,62 0 0 1 -124,0" fill="none"/>

      <text class="selo__arco" fill="#e2d3bb">
        <textPath href="#arco-topo" startOffset="50%" text-anchor="middle">DELIVERY &amp; RETIRADA</textPath>
      </text>

      <!-- Chama -->
      <path fill="#c1121f" d="M100 44c6 8 3 12 6 16 2-3 2-6 2-6 5 6 6 12 6 16 0 10-7 16-14 16s-14-6-14-16c0-7 5-13 8-18 1 4 3 6 4 7-1-6-2-11 2-15z"/>
      <!-- Espátula e garfo cruzados -->
      <g stroke="#c1121f" stroke-width="4.5" stroke-linecap="round">
        <line x1="76" y1="66" x2="120" y2="106"/>
        <line x1="124" y1="66" x2="80" y2="106"/>
      </g>
      <rect x="66" y="58" width="16" height="13" rx="3" transform="rotate(-42 74 64)" fill="#c1121f"/>
      <path fill="#c1121f" d="M126 56l3 3-4 6 4-2 2 3-5 5-4-4z"/>

      <text class="selo__nome" x="100" y="133" text-anchor="middle" fill="#e2d3bb">BRUNÃO</text>
      <rect x="14" y="139" width="172" height="24" rx="12" fill="#c1121f"/>
      <text class="selo__faixa" x="100" y="156" text-anchor="middle" fill="#e2d3bb">COSTELA NO BAFO</text>
      <text class="selo__desde" x="100" y="177" text-anchor="middle" fill="#e2d3bb">DESDE 2021</text>
    </symbol>
  </svg>

  <header class="topo">
    <div class="topo__conteudo">
      <svg class="topo__selo" role="img" aria-label="Brunão Costela no Bafo"><use href="#selo-brunao"/></svg>
      <div class="topo__texto">
        <p class="topo__lenha" id="loja-selo"></p>
        <h1 class="topo__nome" id="loja-nome"></h1>
        <p class="topo__tagline" id="loja-tagline"></p>
      </div>
      <div class="topo__status" id="status-loja" hidden>
        <span class="status__bolinha"></span>
        <span class="status__texto"></span>
      </div>
    </div>
    <nav class="categorias" id="nav-categorias" aria-label="Categorias do cardápio"></nav>
  </header>

  <div class="avisos" id="avisos"></div>

  <main id="cardapio" class="cardapio">
    <p class="carregando">Preparando o cardápio…</p>
  </main>

  <footer class="rodape">
    <svg class="rodape__selo" aria-hidden="true"><use href="#selo-brunao"/></svg>
    <p class="rodape__info" id="rodape-horarios"></p>
    <p class="rodape__info" id="rodape-endereco" hidden></p>
    <p class="rodape__links">
      <a id="rodape-whatsapp" target="_blank" rel="noopener"></a>
      <span aria-hidden="true">·</span>
      <a id="rodape-instagram" target="_blank" rel="noopener"></a>
    </p>
    <p class="rodape__credito">Brunão Costela no Bafo · <span id="loja-desde"></span></p>
  </footer>

  <!-- Fala com a loja. Some quando o modal do pedido está aberto. -->
  <a class="zap-flutuante" id="zap-flutuante" target="_blank" rel="noopener"
     aria-label="Tirar uma dúvida no WhatsApp">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.76-1.66-2.06-.17-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37s-1.04 1.02-1.04 2.48 1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35z"/>
      <path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m0 1.67c2.2 0 4.27.86 5.82 2.42a8.19 8.19 0 0 1 2.42 5.82c0 4.54-3.7 8.24-8.25 8.24-1.45 0-2.87-.39-4.11-1.12l-.29-.18-3.06.8.82-3-.19-.31a8.2 8.2 0 0 1-1.26-4.39c0-4.54 3.7-8.24 8.25-8.24"/>
    </svg>
  </a>

  <!-- Barra flutuante do carrinho -->
  <button class="barra-carrinho" id="barra-carrinho" hidden>
    <span class="barra-carrinho__qtd" id="carrinho-qtd">0</span>
    <span class="barra-carrinho__label">Ver meu pedido</span>
    <span class="barra-carrinho__total" id="carrinho-total">R$ 0,00</span>
  </button>

  <!-- Modal do pedido -->
  <div class="modal" id="modal-pedido" hidden>
    <div class="modal__fundo" data-fechar-modal></div>
    <div class="modal__caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <header class="modal__topo">
        <h2 id="modal-titulo">Seu pedido</h2>
        <button class="modal__fechar" data-fechar-modal aria-label="Fechar">&times;</button>
      </header>

      <div class="modal__corpo">
        <ul class="lista-pedido" id="lista-pedido"></ul>

        <form class="form-pedido" id="form-pedido" novalidate>
          <label class="campo">
            <span class="campo__label">Seu nome</span>
            <input type="text" name="nome" required autocomplete="name" placeholder="Como te chamamos?">
          </label>

          <fieldset class="campo campo--opcoes">
            <legend class="campo__label">Como quer receber?</legend>
            <label class="opcao">
              <input type="radio" name="entrega" value="entrega" checked>
              <span>Entrega</span>
            </label>
            <label class="opcao">
              <input type="radio" name="entrega" value="retirada">
              <span>Retirar no local</span>
            </label>
          </fieldset>

          <label class="campo">
            <span class="campo__label" id="label-data">Data da entrega</span>
            <select name="data" id="select-data"></select>
          </label>

          <label class="campo" id="campo-endereco">
            <span class="campo__label">Endereço completo</span>
            <input type="text" name="endereco" autocomplete="street-address"
                   placeholder="Rua, número, bairro e ponto de referência">
          </label>

          <div class="campo" id="campo-agendar" hidden>
            <label class="agendar">
              <input type="checkbox" name="agendar" id="check-agendar">
              <span class="agendar__texto">
                <strong>Quero agendar um horário</strong>
                <small id="agendar-descricao"></small>
              </span>
            </label>
            <label class="campo campo--hora" id="campo-hora" hidden>
              <span class="campo__label">Horário desejado</span>
              <select name="hora" id="select-hora"></select>
            </label>
          </div>

          <label class="campo" id="campo-pagamento">
            <span class="campo__label">Pagamento</span>
            <select name="pagamento" id="select-pagamento"></select>
          </label>

          <label class="campo" id="campo-troco" hidden>
            <span class="campo__label">Precisa de troco para quanto?</span>
            <input type="text" name="troco" inputmode="numeric" placeholder="Ex.: 100 (deixe vazio se não precisa)">
          </label>

          <label class="campo">
            <span class="campo__label">Observações <span class="campo__opcional">(opcional)</span></span>
            <textarea name="observacoes" rows="2" placeholder="Capricha na farofa, sem creme de alho…"></textarea>
          </label>
        </form>

        <dl class="resumo" id="resumo-valores"></dl>
        <p class="erro-form" id="erro-form" hidden></p>
      </div>

      <footer class="modal__rodape">
        <button type="submit" form="form-pedido" class="botao-enviar" id="botao-enviar">
          Enviar pedido pelo WhatsApp
        </button>
        <p class="modal__aviso" id="modal-aviso">Você confere a mensagem no WhatsApp antes de enviar.</p>
      </footer>
    </div>
  </div>

  <script src="js/menu-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
